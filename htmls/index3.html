<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TheLabSoft — Creations by imagination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      overflow-x: hidden;
      max-width: 100vw;
      font-family: "Archivo", sans-serif;
      background: #0a0a0b;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    a:hover {
      color: #fff;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 720px;
      overflow: hidden;
      background: #0a0a0b;
    }

    .hero__video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
      pointer-events: none;
      /* Keep video fully opaque — Chrome blocks muted autoplay on opacity:0 / invisible media */
      opacity: 1;
    }

    .hero__cover {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #0a0a0b;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .hero__cover.is-hidden {
      opacity: 0;
    }

    /* Hide Chrome/WebKit native play overlay while the video loads */
    .hero__video::-webkit-media-controls {
      display: none !important;
    }

    .hero__video::-webkit-media-controls-enclosure {
      display: none !important;
    }

    .hero__video::-webkit-media-controls-start-playback-button,
    .hero__video::-webkit-media-controls-overlay-play-button {
      display: none !important;
      -webkit-appearance: none;
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
    }

    .hero__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(8, 8, 10, 0.55) 0%,
        rgba(8, 8, 10, 0.15) 30%,
        rgba(8, 8, 10, 0.25) 55%,
        rgba(8, 8, 10, 0.92) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    .navbar {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 34px 56px;
    }

    .navbar__links {
      display: flex;
      align-items: center;
      gap: 42px;
      list-style: none;
    }

    .navbar__links a {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.82);
    }

    .navbar__links a.is-active {
      color: #fff;
      border-bottom: 2px solid #fff;
      padding-bottom: 3px;
    }

    .navbar__logo {
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .navbar__cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #faf9f5;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      padding: 11px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .navbar__cta span {
      font-size: 15px;
    }

    .navbar__cta:hover {
      background: #e9e9ec;
      color: #0a0a0b;
    }

    .hero__title {
      position: absolute;
      top: 92px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 2;
      font-size: 13.3vw;
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.03em;
      white-space: nowrap;
      background: linear-gradient(180deg, #ffffff 55%, #b8b8bd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .hero__copy {
      position: absolute;
      left: 56px;
      bottom: 56px;
      z-index: 3;
      max-width: 620px;
    }

    .hero__copy h2 {
      color: #fff;
      font-weight: 600;
      font-size: clamp(38px, 5.8vw, 66px);
      line-height: 0.98;
      letter-spacing: -0.02em;
    }

    .hero__copy p {
      color: rgba(255, 255, 255, 0.82);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      max-width: 480px;
      margin-top: 18px;
    }

    .hero__discover {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 32px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      font-family: inherit;
      padding: 13px 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .hero__discover span {
      font-size: 15px;
    }

    .hero__discover:hover {
      background: #fff;
      color: #0a0a0b;
      border-color: #fff;
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 24px 20px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .navbar__links {
        gap: 20px;
        order: 2;
        width: 100%;
      }

      .hero__copy {
        left: 20px;
        right: 20px;
        bottom: 32px;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="Hero">
    <video
      class="hero__video"
      id="hero-video"
      muted
      loop
      playsinline
      webkit-playsinline
      autoplay
      preload="auto"
      disablePictureInPicture
      disableRemotePlayback
    >
      <source src="https://thelabsoft.com/main-video.mp4" type="video/mp4" />
    </video>
    <div class="hero__cover" id="hero-cover" aria-hidden="true"></div>
    <div class="hero__overlay" aria-hidden="true"></div>

    <nav class="navbar">
      <ul class="navbar__links">
        <li><a href="#" class="is-active">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Team</a></li>
        <li><a href="#">Projects</a></li>
      </ul>
      <div class="navbar__logo">TheLabSoft</div>
      <button type="button" class="navbar__cta">
        Browse projects <span>→</span>
      </button>
    </nav>

    <div class="hero__copy">
      <h2>Customized Software Solutions</h2>
      <p>We develop software solutions tailored to the needs of the EAFIT community, ensuring efficiency and ease of use.</p>
      <button type="button" class="hero__discover">
        DISCOVER NOW <span>↗</span>
      </button>
    </div>
  </section>

  <script>
    (function () {
      const video = document.getElementById("hero-video");
      const cover = document.getElementById("hero-cover");
      if (!video) return;

      let hasStarted = false;

      function lockMute() {
        video.muted = true;
        video.defaultMuted = true;
        video.volume = 0;
        video.playsInline = true;
        video.autoplay = true;
        video.controls = false;
        video.setAttribute("muted", "");
        video.setAttribute("autoplay", "");
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.removeAttribute("controls");
      }

      function reveal() {
        if (cover) cover.classList.add("is-hidden");
      }

      function ensurePlay() {
        lockMute();
        const result = video.play();
        if (result && typeof result.then === "function") {
          return result.then(function () {
            hasStarted = true;
            reveal();
          }).catch(function () {
            return false;
          });
        }
        if (!video.paused) {
          hasStarted = true;
          reveal();
        }
        return Promise.resolve();
      }

      lockMute();
      try { video.load(); } catch (e) {}
      ensurePlay();

      ["loadedmetadata", "loadeddata", "canplay", "canplaythrough", "playing"].forEach(function (evt) {
        video.addEventListener(evt, function () {
          ensurePlay();
          if (!video.paused) reveal();
        });
      });

      video.addEventListener("playing", function () {
        hasStarted = true;
        reveal();
      });

      // Only re-play after a successful start (don't fight a blocked first play()).
      video.addEventListener("pause", function () {
        if (hasStarted) ensurePlay();
      });
      video.addEventListener("ended", function () {
        video.currentTime = 0;
        ensurePlay();
      });

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) ensurePlay();
      });

      // Last resort if Data Saver / site setting blocks muted autoplay.
      function unlockOnGesture() {
        ensurePlay();
      }
      ["touchstart", "pointerdown", "click"].forEach(function (evt) {
        document.addEventListener(evt, unlockOnGesture, { passive: true, once: true });
      });

      const watchdog = setInterval(function () {
        if (video.paused) ensurePlay();
        else reveal();
      }, 500);

      window.addEventListener("pagehide", function () {
        clearInterval(watchdog);
      });
    })();
  </script>
</body>
</html>
